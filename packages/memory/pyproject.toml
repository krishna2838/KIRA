[project]
name = "kira-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kira-core",
    "kira-brain",
    "asyncpg>=0.29",
    "pgvector>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kira*"]
