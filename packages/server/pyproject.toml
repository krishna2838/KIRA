[project]
name = "kira-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kira-core",
    "kira-brain",
    "kira-memory",
    "kira-tools",
    "kira-voice",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kira*"]
