[project]
name = "kira-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kira-core",
    "kira-brain",
    "kira-memory",
    "mcp>=1.0",
    "duckduckgo-search>=6.2",
    "redis>=5.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "wikipedia-api>=0.7",
    "playwright>=1.47",
    "Pillow>=10.4",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "keyring>=25.2",
    "GitPython>=3.1",
    "PyGithub>=2.4",
    "rich>=13.7",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "watchdog>=5.0",
    "paddleocr>=2.7; sys_platform == 'darwin'",
    "APScheduler>=3.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kira*"]
