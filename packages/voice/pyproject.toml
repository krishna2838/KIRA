[project]
name = "kira-voice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kira-core",
    "kira-brain",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "piper-tts>=1.2",
    "silero-vad>=5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kira*"]
